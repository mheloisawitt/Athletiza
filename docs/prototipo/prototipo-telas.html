*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14.5px/1.4 Barlow,system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}

#stage{flex:1;min-height:0;position:relative}

.hero{display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(115deg,#2a0f4d 0,transparent 35%),linear-gradient(295deg,#0c3a20 0,transparent 30%),var(--side);border-right:1px solid var(--line)}

.side{padding:14px;display:flex;flex-direction:column;gap:12px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}

@media (prefers-reduced-motion:no-preference){.modal,#mapa .dr{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
